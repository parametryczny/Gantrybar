name: GNU/Linux packages

on:
  push:
    paths:
      - 'linux/**'
      - 'windows/Gantry.Windows/UI/DashboardWindow.xaml.cs'
      - 'windows/Gantry.Windows/UI/GantryTheme.cs'
      - 'Sources/Gantry/App/GantryTheme.swift'
      - 'Sources/Gantry/Views/PrinterDashboardViewController.swift'
      - 'design/gantry-card-layout.impl.json'
      - 'scripts/check_ui_parity.py'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'linux/**'
      - 'windows/Gantry.Windows/UI/DashboardWindow.xaml.cs'
      - 'windows/Gantry.Windows/UI/GantryTheme.cs'
      - 'Sources/Gantry/App/GantryTheme.swift'
      - 'Sources/Gantry/Views/PrinterDashboardViewController.swift'
      - 'design/gantry-card-layout.impl.json'
      - 'scripts/check_ui_parity.py'
      - '.github/workflows/linux.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Debian package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Check macOS / Windows / Linux UI parity
        run: python3 scripts/check_ui_parity.py
      - name: Install runtime and test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-gi python3-websocket gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0
          gir1.2-gstreamer-1.0 gir1.2-ayatanaappindicator3-0.1
          gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          libsecret-tools gnome-keyring libnotify-bin openssl avahi-daemon
          x11-xserver-utils xvfb
      - name: Run core tests
        run: PYTHONPATH=linux python3 -m unittest discover -s linux/tests -v
      - name: Compile Python sources
        run: PYTHONPATH=linux python3 -m compileall -q linux/gantry
      - name: Load GTK application module
        run: xvfb-run -a env PYTHONPATH=linux python3 -c "import gantry.app"
      - name: Desktop integration self-test
        run: xvfb-run -a env PYTHONPATH=linux python3 -m gantry --diagnose
      - name: Build Debian package
        run: sh linux/scripts/build-deb.sh
      - name: Inspect and install Debian package
        run: |
          DEB=$(find linux/dist -maxdepth 1 -name '*.deb' -print -quit)
          dpkg-deb --info "$DEB"
          sudo apt-get install -y "./$DEB"
          gantry --version
          sha256sum "$DEB" > "$DEB.sha256"
      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: Gantry-Linux-DEB
          path: |
            linux/dist/*.deb
            linux/dist/*.deb.sha256
          if-no-files-found: error

  rpm:
    name: RPM package
    runs-on: ubuntu-24.04
    container: fedora:44
    steps:
      - name: Install build and runtime dependencies
        run: >-
          dnf install -y git-core findutils rpm-build python3-devel python3-gobject
          python3-websocket-client gtk3 libayatana-appindicator-gtk3 libsecret
          libnotify openssl avahi xset gstreamer1-plugins-base
          gstreamer1-plugins-good gstreamer1-plugins-good-gtk gstreamer1-plugins-bad-free gstreamer1-plugin-libav
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Run core tests
        run: PYTHONPATH=linux python3 -m unittest discover -s linux/tests -v
      - name: Build RPM package
        run: sh linux/scripts/build-rpm.sh
      - name: Inspect and install RPM package
        run: |
          RPM=$(find linux/dist -maxdepth 1 -name '*.rpm' -print -quit)
          rpm -qip "$RPM"
          dnf install -y "./$RPM"
          gantry --version
          sha256sum "$RPM" > "$RPM.sha256"
      - name: Upload RPM package
        uses: actions/upload-artifact@v7
        with:
          name: Gantry-Linux-RPM
          path: |
            linux/dist/*.rpm
            linux/dist/*.rpm.sha256
          if-no-files-found: error

  appimage:
    name: AppImage (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install AppImage build dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          python3-dev python3-pip python3-gi python3-websocket
          gir1.2-gtk-3.0 gir1.2-gdkpixbuf-2.0 gir1.2-gstreamer-1.0
          gir1.2-ayatanaappindicator3-0.1 libgtk-3-dev librsvg2-dev
          libgirepository1.0-dev libayatana-appindicator3-dev
          gstreamer1.0-tools gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav
          file pkg-config patchelf libfuse2 xvfb
      - name: Install private Python bundler
        run: python3 -m pip install --user pyinstaller
      - name: Build AppImage
        run: sh linux/scripts/build-appimage.sh
      - name: Inspect and smoke-test AppImage
        run: |
          APPIMAGE=$(find linux/dist -maxdepth 1 -name '*.AppImage' -print -quit)
          file "$APPIMAGE"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --diagnose
          sha256sum "$APPIMAGE" > "$APPIMAGE.sha256"
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: Gantry-Linux-AppImage-x86_64
          path: |
            linux/dist/*.AppImage
            linux/dist/*.AppImage.sha256
          if-no-files-found: error
