name: Build and self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Show Swift version
        run: swift --version
      - name: Check macOS / Windows / Linux UI parity
        run: python3 scripts/check_ui_parity.py
      - name: Check translation catalog
        run: python3 scripts/i18n_check.py --strict
      # Catches a dropped x:Name here rather than on the Windows runner, where it is a CS0103.
      - name: Check WPF markup against its code-behind
        run: python3 scripts/check_xaml_names.py --base "${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
      - name: Build
        run: swift build --disable-sandbox
      - name: Run protocol self-test
        run: .build/debug/Gantry --self-test
      - name: Run local storage self-test
        run: .build/debug/Gantry --storage-self-test
      - name: Run certificate pin self-test
        run: .build/debug/Gantry --certificate-pin-self-test
      - name: Compile Keychain variant
        run: swift build --disable-sandbox -Xswiftc -DKEYCHAIN_STORAGE
