name: Windows build

on:
  push:
    paths:
      - 'windows/**'
      - 'Sources/Gantry/App/GantryTheme.swift'
      - 'Sources/Gantry/Views/PrinterDashboardViewController.swift'
      - 'linux/gantry/dashboard.py'
      - 'linux/gantry/layout.py'
      - 'design/gantry-card-layout.impl.json'
      - 'scripts/check_ui_parity.py'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'windows/**'
      - 'Sources/Gantry/App/GantryTheme.swift'
      - 'Sources/Gantry/Views/PrinterDashboardViewController.swift'
      - 'linux/gantry/dashboard.py'
      - 'linux/gantry/layout.py'
      - 'design/gantry-card-layout.impl.json'
      - 'scripts/check_ui_parity.py'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Check macOS / Windows / Linux UI parity
        working-directory: .
        run: python scripts/check_ui_parity.py
      - name: Restore
        run: dotnet restore Gantry.Windows/Gantry.Windows.csproj
      - name: Build
        run: dotnet build Gantry.Windows/Gantry.Windows.csproj -c Release --no-restore
      - name: Test Bambu Studio config import
        shell: pwsh
        # TFM-independent: find the built Gantry.exe regardless of the net8.0-windows(10.0.x) folder.
        run: |
          $exe = Get-ChildItem -Path Gantry.Windows\bin\Release -Recurse -Filter Gantry.exe | Select-Object -First 1
          if (-not $exe) { throw "Gantry.exe not found after build." }
          & $exe.FullName --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Render Spoolbase preview (off-screen WPF)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path Gantry.Windows\bin\Release -Recurse -Filter Gantry.exe | Select-Object -First 1
          if (-not $exe) { throw "Gantry.exe not found for render." }
          $out = Join-Path $PWD "render-out"
          $p = Start-Process -FilePath $exe.FullName -ArgumentList "--render","$out" -Wait -PassThru
          Write-Host "render exit: $($p.ExitCode)"
          if (Test-Path $out) { Get-ChildItem $out | ForEach-Object { Write-Host $_.Name $_.Length } }
          else { Write-Warning "no render output" }
      - name: Upload Windows preview
        uses: actions/upload-artifact@v7
        with:
          name: windows-preview
          path: windows/render-out/*.png
          if-no-files-found: warn
      # Self-contained FOLDER publish (not a self-extracting single-file exe). The self-extract
      # pattern is the main trigger for Avast/SmartScreen false positives — see issue #20.
      - name: Publish self-contained app
        run: dotnet publish Gantry.Windows/Gantry.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o publish
      - name: Bundle ffmpeg (Bambu chamber camera)
        shell: pwsh
        # The Bambu camera is rtsps/H.264, which we decode with ffmpeg into an MJPEG pipe (see
        # UI/DetailWindow.cs). Fetch a static win64 build and drop ffmpeg.exe next to the app so it
        # lands in both the installer (publish\*) and the ZIP. GPL build — invoked as a separate process.
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip -UseBasicParsing
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $exe) { throw "ffmpeg.exe not found in the downloaded archive." }
          Copy-Item $exe.FullName -Destination publish\ffmpeg.exe -Force
          Write-Host "Bundled ffmpeg: $((Get-Item publish\ffmpeg.exe).Length) bytes"
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --yes --no-progress
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found."
          }
      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "installer\Gantry.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test silent install, autostart and uninstall
        shell: pwsh
        run: |
          $setup = Resolve-Path "installer-output\Gantry-Setup-Windows-x64.exe"
          $install = Start-Process -FilePath $setup -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }

          $installedExe = Join-Path $env:LOCALAPPDATA "Programs\Gantry\Gantry.exe"
          if (-not (Test-Path $installedExe)) { throw "Installed application was not found." }

          $runValue = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Gantry" -ErrorAction Stop).Gantry
          if ($runValue -notlike "*Gantry.exe*") { throw "Autostart registry value is invalid." }

          $uninstaller = Join-Path $env:LOCALAPPDATA "Programs\Gantry\unins000.exe"
          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /NORESTART" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          if (Test-Path $installedExe) { throw "Application remained after uninstall." }

          $runKey = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "Gantry" -ErrorAction SilentlyContinue
          if ($null -ne $runKey) { throw "Autostart value remained after uninstall." }
      - name: Package ZIP
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Gantry-Windows-x64.zip -Force
      - name: Upload packaged application
        uses: actions/upload-artifact@v7
        with:
          name: Gantry-Windows-x64
          path: windows/Gantry-Windows-x64.zip
          if-no-files-found: error
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: Gantry-Windows-Installer-x64
          path: windows/installer-output/Gantry-Setup-Windows-x64.exe
          if-no-files-found: error
