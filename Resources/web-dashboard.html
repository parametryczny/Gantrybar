<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Gantry</title>
  <style>
    :root {
      --canvas:#0c0d0e; --card:#151719; --surface:rgba(255,255,255,.052);
      --line:rgba(255,255,255,.09); --text:#f2f3f1; --secondary:#a7aaa6;
      --muted:#6d716e; --metric:#d4d7d3; --nozzle:#ff8a61; --bed:#efbd5f;
      --chamber:#bba5ef; --humidity:#73cfad; --warning:#ebb55c;
      --shadow:0 24px 70px rgba(0,0,0,.32);
    }
    @media (prefers-color-scheme:light) {
      :root {
        --canvas:#f2f2f7; --card:#fff; --surface:rgba(28,28,30,.045);
        --line:rgba(28,28,30,.11); --text:#1c1c1e; --secondary:#636366;
        --muted:#8e8e93; --metric:#3a3a3c; --shadow:0 20px 60px rgba(28,28,30,.12);
      }
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--canvas); }
    body {
      min-height:100vh; margin:0; padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right))
        max(24px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));
      background:
        radial-gradient(circle at 15% -10%,rgba(255,255,255,.055),transparent 34rem),
        var(--canvas);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
      -webkit-font-smoothing:antialiased;
    }
    .shell { width:min(1180px,100%); margin:0 auto; }
    .masthead { display:flex; align-items:center; gap:12px; min-height:44px; margin-bottom:18px; }
    .brand { font-size:18px; font-weight:800; letter-spacing:.08em; }
    .fleet-state { display:flex; align-items:center; gap:7px; color:var(--secondary); font-size:12px; }
    .live-dot { width:7px; height:7px; border-radius:50%; background:var(--muted); box-shadow:0 0 0 3px transparent; }
    .live-dot.on { background:var(--humidity); box-shadow:0 0 0 3px color-mix(in srgb,var(--humidity) 16%,transparent); }
    .read-only { margin-left:auto; color:var(--muted); font-size:11px; }
    .grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; align-items:start; }
    .empty { grid-column:1/-1; padding:64px 20px; color:var(--secondary); text-align:center; border:1px solid var(--line); border-radius:16px; }
    .card {
      position:relative; overflow:hidden; min-width:0; padding:6px 10px;
      border:1px solid var(--line); border-radius:16px;
      background:color-mix(in srgb,var(--card) 86%,transparent); box-shadow:var(--shadow);
    }
    .header { display:flex; align-items:center; gap:7px; min-width:0; min-height:22px; }
    .printer-icon { width:14px; height:14px; flex:0 0 14px; color:var(--metric); }
    .name { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; font-weight:650; }
    .protocol { flex:0 0 auto; padding:1px 5px; border-radius:5px; background:var(--surface); color:var(--muted); font-size:9px; font-weight:600; }
    .header-spacer { flex:1; }
    .state-shape { width:6px; height:6px; flex:0 0 6px; border-radius:50%; background:var(--metric); }
    .state-shape.error { border-radius:1px; background:#ff5a4e; transform:rotate(45deg); }
    .state-shape.offline { border:1px solid var(--muted); background:transparent; }
    .card-body { position:relative; min-width:0; }
    .status-row { display:flex; align-items:center; gap:5px; min-width:0; min-height:20px; }
    .state { flex:0 0 auto; color:var(--metric); font-size:10px; font-weight:600; }
    .separator { color:var(--muted); font-size:10px; }
    .job { min-width:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:10px; font-weight:600; }
    .percent { flex:0 0 auto; margin-left:4px; color:var(--metric); font:700 14px ui-monospace,"SFMono-Regular",Consolas,monospace; font-variant-numeric:tabular-nums; }
    .progress-row { display:grid; grid-template-columns:minmax(72px,1fr) auto auto; align-items:center; gap:8px; min-height:17px; }
    .progress { height:8px; border-radius:2px; overflow:hidden; background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--metric) 14%,transparent) 0 calc(3.125% - 2px),transparent calc(3.125% - 2px) 3.125%) center/100% 4px no-repeat; }
    .progress-fill { height:4px; width:0; margin-top:2px; background:repeating-linear-gradient(90deg,var(--metric) 0 calc(3.125% - 2px),transparent calc(3.125% - 2px) 3.125%); }
    .metric { color:var(--secondary); white-space:nowrap; font:600 10px ui-monospace,"SFMono-Regular",Consolas,monospace; font-variant-numeric:tabular-nums; }
    .rule { height:1px; margin:3px 0; background:var(--line); }
    .temps { display:grid; grid-auto-flow:column; grid-auto-columns:1fr; min-height:22px; }
    .temp { display:flex; align-items:baseline; gap:5px; min-width:0; padding:0 6px; }
    .temp-label { overflow:hidden; color:var(--muted); font:600 7px ui-monospace,"SFMono-Regular",Consolas,monospace; letter-spacing:.04em; text-overflow:ellipsis; }
    .temp-value { white-space:nowrap; font:650 14px ui-monospace,"SFMono-Regular",Consolas,monospace; font-variant-numeric:tabular-nums; }
    .filaments { display:flex; flex-wrap:wrap; gap:6px; }
    .group { flex:var(--weight,1) 1 118px; min-width:0; padding:4px 6px; }
    .group + .group { border-left:1px solid var(--line); }
    .group-head { display:flex; align-items:center; gap:6px; min-height:16px; overflow:hidden; white-space:nowrap; }
    .group-name { overflow:hidden; color:var(--text); font-size:10px; font-weight:650; text-overflow:ellipsis; }
    .env { color:color-mix(in srgb,var(--metric) 72%,transparent); font-size:9px; font-weight:500; }
    .slots { display:grid; grid-template-columns:repeat(var(--count,1),minmax(0,1fr)); gap:5px; margin-top:3px; }
    .slot { min-width:0; text-align:center; }
    .swatch {
      position:relative; display:flex; align-items:center; justify-content:center; width:100%; max-width:56px; height:18px; margin:0 auto;
      overflow:hidden; border:1px solid rgba(0,0,0,.14); border-radius:6px;
      background:linear-gradient(to top,var(--color) 0 var(--fill),color-mix(in srgb,var(--color) 20%,transparent) var(--fill) 100%);
      color:var(--ink); text-shadow:0 1px 2px var(--shadow-ink); font:700 9px ui-monospace,"SFMono-Regular",Consolas,monospace;
    }
    .group.external .swatch { max-width:92px; }
    .slots.single .swatch { width:max(60px,35%); max-width:92px; margin-left:0; }
    .swatch.empty { border-color:var(--line); background:repeating-linear-gradient(45deg,var(--surface) 0 2px,transparent 2px 7px); color:var(--muted); text-shadow:none; }
    .swatch.active { border:1.5px solid color-mix(in srgb,var(--text) 82%,transparent); }
    .slot-meta { display:flex; align-items:center; justify-content:center; min-width:0; min-height:11px; margin-top:1px; }
    .slot-id { margin-right:auto; color:color-mix(in srgb,var(--metric) 62%,transparent); font:500 7.5px ui-monospace,"SFMono-Regular",Consolas,monospace; }
    .material { min-width:0; overflow:hidden; color:var(--metric); font-size:10px; font-weight:650; text-overflow:ellipsis; white-space:nowrap; }
    .grams { color:var(--metric); font:600 10px ui-monospace,"SFMono-Regular",Consolas,monospace; }
    .offline-layer { position:absolute; inset:0; display:none; place-items:center; padding:10px; border-radius:0 0 14px 14px; background:color-mix(in srgb,var(--canvas) 76%,transparent); backdrop-filter:blur(9px); }
    .card.offline .offline-layer { display:grid; }
    .offline-message { max-width:270px; padding:10px 14px; border:1px solid var(--line); border-radius:12px; background:color-mix(in srgb,var(--card) 88%,transparent); color:var(--secondary); text-align:center; font-size:11px; font-weight:600; }
    .offline-message svg { display:block; width:16px; height:16px; margin:0 auto 5px; }
    .footer { margin:18px 0 2px; color:var(--muted); text-align:center; font-size:10px; }
    @media (max-width:760px) { .grid{grid-template-columns:1fr}.read-only{display:none} }
    @media (max-width:420px) { body{padding-left:10px;padding-right:10px}.card{padding-left:8px;padding-right:8px}.protocol{display:none}.metric{font-size:9px} }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand">GANTRY</div>
      <div class="fleet-state" id="fleetState"><span class="live-dot" id="liveDot"></span><span id="fleetText">Ładowanie…</span></div>
      <div class="read-only" id="readOnly">Podgląd tylko do odczytu</div>
    </header>
    <section class="grid" id="grid"></section>
    <footer class="footer" id="footer">Na żywo · tylko sieć lokalna</footer>
  </main>
  <script>
    const pl=(navigator.language||'pl').toLowerCase().startsWith('pl');
    const copy=pl?{loading:'Ładowanie…',printers:'drukarek',working:'pracuje',readonly:'Podgląd tylko do odczytu',footer:'Na żywo · tylko sieć lokalna',empty:'Brak skonfigurowanych drukarek',offline:'Brak połączenia z drukarką',nojob:'BRAK AKTYWNEGO ZADANIA',nozzle:'DYSZA',bed:'STÓŁ',chamber:'KOMORA',states:{printing:'Drukowanie',paused:'Pauza',finished:'Zakończono',idle:'Gotowa',ready:'Gotowa',error:'Błąd',offline:'Offline'}}:{loading:'Loading…',printers:'printers',working:'printing',readonly:'Read-only preview',footer:'Live · local network only',empty:'No configured printers',offline:'No connection to the printer',nojob:'NO ACTIVE JOB',nozzle:'NOZZLE',bed:'BED',chamber:'CHAMBER',states:{printing:'Printing',paused:'Paused',finished:'Finished',idle:'Ready',ready:'Ready',error:'Error',offline:'Offline'}};
    document.documentElement.lang=pl?'pl':'en'; document.getElementById('readOnly').textContent=copy.readonly; document.getElementById('footer').textContent=copy.footer;
    const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
    const clamp=value=>Math.max(0,Math.min(100,Number(value)||0));
    const shortGroup=name=>{name=String(name||'');if(name==='AMS A')return'AMS';if(name==='AMS HT')return'HT';return name};
    const protocol=p=>p.protocol||'LAN';
    function color(hex){const raw=String(hex||'8E8E93').replace('#','').slice(0,6);return/^[0-9a-f]{6}$/i.test(raw)?'#'+raw:'#8e8e93'}
    function ink(hex,percent){if(clamp(percent)<50)return['#fff','rgba(0,0,0,.42)'];const raw=color(hex).slice(1),r=parseInt(raw.slice(0,2),16),g=parseInt(raw.slice(2,4),16),b=parseInt(raw.slice(4,6),16),dark=(.299*r+.587*g+.114*b)/255>.58;return dark?['#151719','rgba(255,255,255,.38)']:['#fff','rgba(0,0,0,.42)']}
    function printerIcon(){return'<svg class="printer-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h8v4H4zM3 6h10a2 2 0 0 1 2 2v3h-3v3H4v-3H1V8a2 2 0 0 1 2-2Zm2 7h6V9H5Zm7-5.2h1" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>'}
    function offlineIcon(){return'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="m2 2 12 12M3.5 6.5a7 7 0 0 1 8.2-.9M5.7 8.8a3.8 3.8 0 0 1 3.6-.6M8 12h.01" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'}
    function eta(minutes){if(minutes==null||Number(minutes)<=0)return'◷ —';const n=Math.round(Number(minutes)),remaining=n>=60?Math.floor(n/60)+'h '+n%60+'m':n+'m',end=new Date(Date.now()+n*60000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});return'◷ '+remaining+' · '+end}
    function temperature(label,value,css){const shown=value==null?'—':Math.round(Number(value))+'°';return'<div class="temp"><span class="temp-label">'+label+'</span><span class="temp-value" style="color:'+css+'">'+shown+'</span></div>'}
    function slot(s,external,single){const present=Boolean(s.material)||s.percent!=null||s.grams!=null,pct=s.percent==null?null:clamp(s.percent),c=color(s.colorHex),inks=ink(s.colorHex,pct),style='--color:'+c+';--fill:'+(pct==null?100:pct)+'%;--ink:'+inks[0]+';--shadow-ink:'+inks[1],id=external?'':esc(s.label),grams=s.grams!=null&&Number(s.grams)>0?'<div class="grams">'+Math.round(Number(s.grams))+' g</div>':'';return'<div class="slot"><div class="swatch '+(!present?'empty ':'')+(s.active?'active':'')+'" style="'+style+'">'+(pct==null?'':Math.round(pct)+'%')+'</div><div class="slot-meta">'+(id?'<span class="slot-id">'+id+'</span>':'')+'<span class="material">'+esc(s.material||'—')+'</span></div>'+grams+'</div>'}
    function group(g){const slots=Array.isArray(g.slots)?g.slots:[],env=(g.temp!=null?'<span class="env">· 🌡 '+Math.round(Number(g.temp))+'°</span>':'')+(g.humidity!=null?'<span class="env">· 💧 '+esc(Number(g.humidity)<=5?g.humidity+'/5':g.humidity+'%')+'</span>':''),weight=slots.length>1?3:1;return'<div class="group '+(g.external?'external':'')+'" style="--weight:'+weight+'"><div class="group-head"><span class="group-name">'+esc(shortGroup(g.name))+'</span>'+env+'</div><div class="slots '+(slots.length===1?'single':'')+'" style="--count:'+Math.max(1,slots.length)+'">'+slots.map(s=>slot(s,Boolean(g.external),slots.length===1)).join('')+'</div></div>'}
    function card(p){const state=String(p.state||'offline').toLowerCase(),offline=state==='offline',active=state==='printing'||state==='paused',job=active&&p.job?p.job:copy.nojob,progress=clamp(p.progress),layers=p.layer==null?'—':p.layer+'/'+(p.totalLayers??'—'),groups=(p.groups||[]).map(group).join(''),temps=temperature(copy.nozzle,p.nozzle,'var(--nozzle)')+temperature(copy.bed,p.bed,'var(--bed)')+(p.chamber!=null?temperature(copy.chamber,p.chamber,'var(--chamber)'):'');return'<article class="card '+(offline?'offline':'')+'"><div class="header">'+printerIcon()+'<span class="name">'+esc(p.name||'Gantry')+'</span><span class="protocol">'+esc(protocol(p))+'</span><span class="header-spacer"></span></div><div class="card-body"><div class="status-row"><span class="state-shape '+esc(state)+'"></span><span class="state">'+esc(copy.states[state]||state)+'</span><span class="separator">·</span><span class="job">'+esc(job)+'</span><span class="percent">'+Math.round(progress)+'%</span></div><div class="progress-row"><div class="progress"><div class="progress-fill" style="width:'+progress+'%"></div></div><span class="metric">'+eta(p.remainingMinutes)+'</span><span class="metric">▱ '+esc(layers)+'</span></div><div class="rule"></div><div class="temps">'+temps+'</div>'+(groups?'<div class="rule"></div><div class="filaments">'+groups+'</div>':'')+'<div class="offline-layer"><div class="offline-message">'+offlineIcon()+copy.offline+'</div></div></div></article>'}
    let live=false,pollTimer=null;
    function render(data){const printers=data&&Array.isArray(data.printers)?data.printers:[];document.getElementById('liveDot').classList.toggle('on',live);document.getElementById('fleetText').textContent=printers.length+' '+copy.printers+' · '+printers.filter(p=>p.state==='printing').length+' '+copy.working;document.getElementById('grid').innerHTML=printers.length?printers.map(card).join(''):'<div class="empty">'+copy.empty+'</div>'}
    function poll(){fetch('/api/printers',{cache:'no-store'}).then(r=>r.json()).then(render).catch(()=>{document.getElementById('fleetText').textContent=copy.offline})}
    function startPolling(){if(!pollTimer){poll();pollTimer=setInterval(poll,2000)}}
    function connect(){let ws;try{ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws')}catch(_){startPolling();return}const fallback=setTimeout(startPolling,1400);ws.onopen=()=>{clearTimeout(fallback);live=true;document.getElementById('liveDot').classList.add('on')};ws.onmessage=e=>{try{render(JSON.parse(e.data))}catch(_){}};ws.onerror=()=>{live=false;startPolling()};ws.onclose=()=>{live=false;startPolling();setTimeout(connect,4000)}}
    connect();
  </script>
</body>
</html>
